[project]
name = "whatcable"
version = "0.1.0"
description = "Linux USB and USB-C cable checker"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
authors = [
    { name = "Johann Petrak", email = "johann.petrak@gmail.com" }
]
requires-python = ">=3.11"
dependencies = ["pyudev>=0.24.3"]

[project.scripts]
whatcable = "whatcable.cli:main"
whatcable-gui = "whatcable.gui.app:main"

[project.optional-dependencies]
# GTK/libadwaita and PyGObject are provided by the supported Linux distribution.
gui = []

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["src/whatcable/data/*", "LICENSE", "NOTICE"]
